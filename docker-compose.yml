version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dig-app
    restart: always
    expose:
      - 80

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: dig-api
    restart: always
    environment:
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - PORT=${API_PORT:-3001}
    expose:
      - 3001

  shop:
    build:
      context: ./shop
      dockerfile: Dockerfile
    container_name: dig-shop
    restart: always
    environment:
      - DEBUG=False
      - DOCKER_ENV=True
      - POSTGRES_DB=${POSTGRES_DB:-dig}
      - POSTGRES_USER=${POSTGRES_USER:-dig}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dig_luxury_secret_2026}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - shop_media:/tmp/media
    expose:
      - 8000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "mkdir -p /tmp/media/products &&
             cp -rn /app/media/products/* /tmp/media/products/ 2>/dev/null || true &&
             python manage.py migrate --noinput &&
             (python -c "import os, django; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'shop_project.settings'); django.setup(); from products.models import Product; exit(0 if Product.objects.exists() else 1)" || python seed_dig_products.py) &&
             python manage.py runserver 0.0.0.0:8000"

  db:
    image: postgres:16-alpine
    container_name: dig-postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-dig}
      - POSTGRES_USER=${POSTGRES_USER:-dig}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dig_luxury_secret_2026}
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    container_name: dig-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - shop_media:/tmp/media
    depends_on:
      - app
      - api
      - shop

volumes:
  caddy_data:
  caddy_config:
  shop_media: 
  db_data:
