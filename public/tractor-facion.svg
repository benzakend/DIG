<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e07b"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#041426"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Diamond -->
  <rect x="15" y="15" width="170" height="170" rx="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <rect x="25" y="25" width="150" height="150" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
  
  <!-- Crown / Jewel on Top -->
  <path d="M 80 50 L 100 38 L 120 50 L 115 62 L 85 62 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <circle cx="100" cy="36" r="3" fill="#ffffff"/>
  <circle cx="80" cy="48" r="2.5" fill="#f6e07b"/>
  <circle cx="120" cy="48" r="2.5" fill="#f6e07b"/>

  <!-- DIG Text -->
  <text x="100" y="125" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="52" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4" filter="url(#goldGlow)">DIG</text>
  
  <!-- Subtitle -->
  <text x="100" y="155" font-family="'Montserrat', 'Heebo', sans-serif" font-size="10" font-weight="700" fill="#f6e07b" text-anchor="middle" letter-spacing="5" opacity="0.9">HAUTE LUXURY</text>
</svg>
